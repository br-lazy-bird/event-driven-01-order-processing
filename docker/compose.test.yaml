services:
  test-db:
    image: postgres:15-alpine
    container_name: order_processing_test_db
    environment:
      POSTGRES_DB: test_order_processing
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
    volumes:
      - ../database/init-dev:/docker-entrypoint-initdb.d
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d test_order_processing"]
      interval: 5s
      timeout: 5s
      retries: 5

  test-rabbitmq:
    image: rabbitmq:3.13-management
    container_name: order_processing_test_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: test_user
      RABBITMQ_DEFAULT_PASS: test_password
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  test-backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: order_processing_test_backend
    environment:
      - BACKEND_PORT=8000
      - DATABASE_URL=jdbc:postgresql://test-db:5432/test_order_processing
      - POSTGRES_USER=test_user
      - POSTGRES_PASSWORD=test_password
      - RABBITMQ_HOST=test-rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=test_user
      - RABBITMQ_PASSWORD=test_password
      - CORS_ALLOWED_ORIGINS=http://localhost:3000
    depends_on:
      test-rabbitmq:
        condition: service_healthy
      test-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  test-worker:
    build:
      context: ..
      dockerfile: worker/Dockerfile
    container_name: order_processing_test_worker
    environment:
      - RABBITMQ_HOST=test-rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=test_user
      - RABBITMQ_PASSWORD=test_password
      - DATABASE_URL=jdbc:postgresql://test-db:5432/test_order_processing
      - POSTGRES_USER=test_user
      - POSTGRES_PASSWORD=test_password
    depends_on:
      test-rabbitmq:
        condition: service_healthy
      test-backend:
        condition: service_healthy

  test-runner:
    image: maven:3.9-eclipse-temurin-21
    container_name: order_processing_test_runner
    environment:
      - API_URL=http://test-backend:8000
    depends_on:
      test-backend:
        condition: service_healthy
      test-worker:
        condition: service_started
    volumes:
      - ../:/app
      - ~/.m2:/root/.m2
    working_dir: /app
    command: sh -c "sleep 5 && mvn clean install -DskipTests && cd backend && mvn test -Dtest=OrderProcessingE2ETest"
