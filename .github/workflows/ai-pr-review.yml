name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate git diff
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            echo "Missing SHAs, skipping diff generation"
            touch diff.txt
            exit 0
          fi

          if ! git diff "$BASE_SHA"..."$HEAD_SHA" > diff.txt 2>/dev/null; then
            echo "git diff failed, producing empty diff"
            truncate -s 0 diff.txt
          fi

          echo "Diff line count:"
          wc -l diff.txt

      - name: Install OpenAI SDK
        run: |
          python3 -m pip install --upgrade pip
          pip install openai

      - name: Generate AI review
        env:
          CHATGPT_KEY: ${{ secrets.CHATGPT_KEY }}
        run: |
          python3 << 'EOF'
          import os
          from openai import OpenAI

          client = OpenAI(api_key=os.environ["CHATGPT_KEY"])

          with open("diff.txt") as f:
              diff = f.read()

          if not diff.strip():
              print("No changes to review")
              exit(0)

          prompt = f"""
                    You are a Senior Full Stack Software Engineer reviewing a pull request.

          Project context:
          - This repository is part of the Lazy Bird project.
          - Lazy Bird is a collection of deliberately broken backend systems built for learning and practice.
          - Each system contains specific architectural, performance, or design flaws on purpose.
          - Pull requests fix ONE problem at a time, incrementally.
          - Code is NOT expected to be production-ready after each PR.

          Current broken system description:
          - System with event-driven issue

          Review guidelines:
          - Be pragmatic, concise and straighforward.
          - You must indicate which file and line number a comment is refering to. 
          - I want you just to point out corrections or improvements suggestions. Anything else. 
        
          Here is the git diff to review:
          {diff}
          """

          response = client.responses.create(
              model="gpt-4.1-mini",
              input=prompt
          )

          review = response.output_text

          with open("review.txt", "w") as f:
              f.write(review)
          EOF

      - name: Post AI review comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            if (!fs.existsSync('review.txt')) return;

            const review = fs.readFileSync('review.txt', 'utf8').trim();
            if (!review) return;

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "🤖 **AI Code Review — Lazy Bird**\n\n" + review
            });
